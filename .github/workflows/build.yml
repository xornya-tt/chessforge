name: Build muOS app
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: apt-get update && apt-get install -y g++ cmake pkg-config libsdl2-dev zip git make wget ca-certificates
      - name: Rules tests
        run: |
          cmake -S . -B build-tests -DCHESSFORGE_BUILD_TESTS=ON
          cmake --build build-tests -j4
          ./build-tests/chess_rules_tests
      - name: Build game
        run: |
          cmake -S . -B build-rg35xx -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rg35xx -j4
      - name: Build Stockfish (optional)
        continue-on-error: true
        run: |
          git clone --depth 1 --branch sf_17.1 https://github.com/official-stockfish/Stockfish.git
          cd Stockfish/src
          make -j4 net
          make -j4 build ARCH=armv8 COMP=gcc
          cp stockfish /tmp/stockfish
      - name: Fetch Lichess piece set (optional)
        continue-on-error: true
        run: |
          apt-get install -y librsvg2-bin imagemagick
          git clone --depth 1 --filter=blob:none --sparse https://github.com/lichess-org/lila.git /tmp/lila
          cd /tmp/lila && git sparse-checkout set public/piece/cburnett
          mkdir -p "$GITHUB_WORKSPACE/pieces/cburnett"
          for p in wP wN wB wR wQ wK bP bN bB bR bQ bK; do
            rsvg-convert -w 96 -h 96 "public/piece/cburnett/$p.svg" -o "/tmp/$p.png"
            convert "/tmp/$p.png" -define bmp:format=bmp4 "$GITHUB_WORKSPACE/pieces/cburnett/$p.bmp"
          done
      - name: Package
        run: sh scripts/package.sh build-rg35xx $(test -f /tmp/stockfish && echo /tmp/stockfish)
      - uses: actions/upload-artifact@v4
        with:
          name: ChessForge3D.muxapp
          path: out/ChessForge3D.muxapp
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/ChessForge3D.muxapp
          generate_release_notes: true

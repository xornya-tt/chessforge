name: Build muOS app
on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Native ARM64 runner inside Debian bullseye keeps glibc old enough for the console.
    runs-on: ubuntu-24.04-arm
    container: debian:bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          echo 'deb http://archive.debian.org/debian bullseye main' > /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
          apt-get update && apt-get install -y g++ cmake pkg-config libsdl2-dev zip git make wget ca-certificates
      - name: Rules tests
        run: |
          cmake -S . -B build-tests -DCHESSFORGE_BUILD_TESTS=ON
          cmake --build build-tests -j4
          ./build-tests/chess_rules_tests
      - name: Build game
        run: |
          cmake -S . -B build-rg35xx -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rg35xx -j4
      - name: Build Stockfish (optional)
        continue-on-error: true
        run: |
          git clone --depth 1 --branch sf_17.1 https://github.com/official-stockfish/Stockfish.git
          cd Stockfish/src
          make -j4 net
          make -j4 build ARCH=armv8 COMP=gcc
          cp stockfish /tmp/stockfish
      - name: Package
        run: sh scripts/package.sh build-rg35xx $(test -f /tmp/stockfish && echo /tmp/stockfish)
      - uses: actions/upload-artifact@v4
        with:
          name: ChessForge3D.muxapp
          path: out/ChessForge3D.muxapp
